[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sku-scraper"
version = "0.1.0"
description = "CLI tool to scrape Google Cloud SKU Group pages"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "platformdirs>=4.0",
    "tqdm>=4.0",
]

[project.scripts]
sku-scraper = "sku_scraper.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "responses>=0.25",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.coverage.run]
source = ["sku_scraper"]
